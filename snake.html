<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Jogo da Cobrinha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 60%,#020617 100%);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.container{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:14px}
header{text-align:center;width:100%}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#22d3ee,#10b981 50%,#84cc16);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.subtitle{font-size:12px;color:#64748b;font-weight:500}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.15);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
.stat-label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.stat-value{font-size:20px;font-weight:800;color:#f1f5f9;margin-top:2px;font-variant-numeric:tabular-nums}
#score .stat-value{color:#22d3ee}
#best .stat-value{color:#fbbf24}
#speed .stat-value{color:#a78bfa}
.board-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:460px}
canvas{width:100%;height:100%;display:block;border-radius:16px;background:#020617;border:2px solid rgba(34,211,238,.25);box-shadow:0 0 0 1px rgba(148,163,184,.08),0 20px 60px -20px rgba(34,211,238,.25);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,6,23,.85);backdrop-filter:blur(6px);border-radius:16px;text-align:center;padding:24px;gap:12px;transition:opacity .25s}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay h2{font-size:28px;font-weight:800;color:#f1f5f9;letter-spacing:-.5px}
.overlay p{font-size:13px;color:#94a3b8;max-width:280px;line-height:1.5}
.overlay .final-score{font-size:44px;font-weight:900;color:#22d3ee;font-variant-numeric:tabular-nums}
button{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(16,185,129,.35)}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,.45)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(30,41,59,.9);border:1px solid rgba(148,163,184,.2);box-shadow:none}
button.ghost:hover{background:rgba(51,65,85,.9)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.difficulty{display:flex;gap:6px;background:rgba(15,23,42,.7);border:1px solid rgba(148,163,184,.15);border-radius:10px;padding:4px}
.diff-btn{background:transparent;color:#94a3b8;padding:6px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-radius:7px;box-shadow:none}
.diff-btn:hover{background:rgba(51,65,85,.5);transform:none;box-shadow:none}
.diff-btn.active{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#fff;box-shadow:0 2px 8px rgba(34,211,238,.35)}
.help{font-size:11px;color:#475569;text-align:center;line-height:1.6}
.help kbd{background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.2);border-radius:4px;padding:1px 6px;font-family:ui-monospace,monospace;font-size:10px;color:#cbd5e1}
footer{margin-top:8px;font-size:10px;color:#334155}
footer a{color:#475569;text-decoration:none}
footer a:hover{color:#64748b}
.touchpad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;margin-top:6px}
.touchpad button{background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.15);box-shadow:none;padding:0;font-size:20px;color:#cbd5e1;border-radius:10px}
.touchpad button:hover{background:rgba(51,65,85,.9);transform:none;box-shadow:none}
.tp-up{grid-column:2;grid-row:1}
.tp-left{grid-column:1;grid-row:2}
.tp-right{grid-column:3;grid-row:2}
.tp-down{grid-column:2;grid-row:3}
@media(hover:none) and (pointer:coarse){.touchpad{display:grid}.help .kbd-hint{display:none}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🐍 Jogo da Cobrinha</h1>
    <div class="subtitle">Coma as maçãs e cresça sem bater em si mesmo</div>
  </header>
  <div class="hud">
    <div class="stat" id="score"><div class="stat-label">Pontos</div><div class="stat-value">0</div></div>
    <div class="stat" id="best"><div class="stat-label">Recorde</div><div class="stat-value">0</div></div>
    <div class="stat" id="speed"><div class="stat-label">Nível</div><div class="stat-value">1</div></div>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="460" height="460"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Pronto?</h2>
      <p id="overlayText">Use as setas ou WASD para mover. Toque no botão para começar.</p>
      <div class="final-score" id="finalScore" style="display:none"></div>
      <button id="startBtn">Começar</button>
    </div>
  </div>
  <div class="controls">
    <div class="difficulty">
      <button class="diff-btn" data-level="easy">Fácil</button>
      <button class="diff-btn active" data-level="normal">Normal</button>
      <button class="diff-btn" data-level="hard">Difícil</button>
    </div>
    <button class="ghost" id="pauseBtn">⏸ Pausar</button>
  </div>
  <div class="touchpad" id="touchpad">
    <button class="tp-up" data-dir="up">▲</button>
    <button class="tp-left" data-dir="left">◀</button>
    <button class="tp-right" data-dir="right">▶</button>
    <button class="tp-down" data-dir="down">▼</button>
  </div>
  <div class="help">
    <span class="kbd-hint"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ou <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — <kbd>Espaço</kbd> pausa</span>
  </div>
  <footer>Feito com 💚 — <a href="index.html">← voltar para tarefas</a></footer>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const finalScore = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.querySelector('#score .stat-value');
  const bestEl = document.querySelector('#best .stat-value');
  const speedEl = document.querySelector('#speed .stat-value');
  const COLS = 23, ROWS = 23;
  let cell = 20;
  const DIFFICULTIES = {
    easy:   { base: 160, accel: 2, label: 'Fácil' },
    normal: { base: 120, accel: 3, label: 'Normal' },
    hard:   { base: 85,  accel: 4, label: 'Difícil' }
  };
  let difficulty = 'normal';
  let snake, dir, nextDir, apple, score, best, level, tickMs, running, paused, lastTick, ateFlash;

  function resize() {
    const size = Math.min(canvas.clientWidth, canvas.clientHeight);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / COLS;
  }
  window.addEventListener('resize', () => { resize(); draw(); });

  function loadBest() {
    try { return parseInt(localStorage.getItem('snake_best_' + difficulty) || '0', 10); }
    catch { return 0; }
  }
  function saveBest(v) { try { localStorage.setItem('snake_best_' + difficulty, String(v)); } catch {} }

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{x:cx-1,y:cy},{x:cx,y:cy},{x:cx+1,y:cy}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; level = 1;
    tickMs = DIFFICULTIES[difficulty].base;
    placeApple();
    best = loadBest();
    ateFlash = 0;
    updateHud();
  }

  function placeApple() {
    while (true) {
      const a = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      if (!snake.some(s => s.x===a.x && s.y===a.y)) { apple = a; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    speedEl.textContent = level;
  }

  function tick() {
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;
    const head = snake[snake.length-1];
    const nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx<0 || ny<0 || nx>=COLS || ny>=ROWS) return gameOver();
    if (snake.some(s => s.x===nx && s.y===ny)) return gameOver();
    snake.push({x:nx,y:ny});
    if (nx===apple.x && ny===apple.y) {
      score += 10; ateFlash = 8;
      if (score > best) { best = score; saveBest(best); }
      if (score % 50 === 0) {
        level++;
        tickMs = Math.max(45, tickMs - DIFFICULTIES[difficulty].accel*3);
      }
      placeApple();
    } else snake.shift();
    updateHud();
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function draw() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.fillStyle = '#020617';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(148,163,184,.04)';
    ctx.lineWidth = 1;
    for (let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(W,i*cell); ctx.stroke();
    }
    const ax = apple.x*cell, ay = apple.y*cell;
    const pad = cell*0.15, ar = cell/2 - pad;
    const acx = ax + cell/2, acy = ay + cell/2;
    const glow = ctx.createRadialGradient(acx,acy,0,acx,acy,ar*2.2);
    glow.addColorStop(0,'rgba(248,113,113,.45)');
    glow.addColorStop(1,'rgba(248,113,113,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(ax-cell, ay-cell, cell*3, cell*3);
    const appleGrad = ctx.createRadialGradient(acx-ar/3, acy-ar/3, 0, acx, acy, ar);
    appleGrad.addColorStop(0,'#fca5a5');
    appleGrad.addColorStop(1,'#dc2626');
    ctx.fillStyle = appleGrad;
    ctx.beginPath(); ctx.arc(acx,acy,ar,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#16a34a';
    ctx.beginPath();
    ctx.ellipse(acx + ar*0.2, acy - ar*0.9, ar*0.25, ar*0.12, Math.PI/4, 0, Math.PI*2);
    ctx.fill();
    snake.forEach((seg,i) => {
      const isHead = i === snake.length-1;
      const x = seg.x*cell, y = seg.y*cell;
      const p = cell*0.08, t = i/snake.length;
      const flash = ateFlash > 0 ? ateFlash/8 : 0;
      if (isHead) {
        const g = ctx.createLinearGradient(x,y,x+cell,y+cell);
        g.addColorStop(0,'#34d399');
        g.addColorStop(1,'#059669');
        ctx.fillStyle = g;
        roundRect(x+p,y+p,cell-p*2,cell-p*2,cell*0.28);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        const eSize = cell*0.11, eOff = cell*0.22;
        let ex1,ey1,ex2,ey2;
        if (dir.x===1)       { ex1=x+cell-eOff; ey1=y+eOff;      ex2=x+cell-eOff; ey2=y+cell-eOff; }
        else if (dir.x===-1) { ex1=x+eOff;      ey1=y+eOff;      ex2=x+eOff;      ey2=y+cell-eOff; }
        else if (dir.y===-1) { ex1=x+eOff;      ey1=y+eOff;      ex2=x+cell-eOff; ey2=y+eOff; }
        else                 { ex1=x+eOff;      ey1=y+cell-eOff; ex2=x+cell-eOff; ey2=y+cell-eOff; }
        ctx.beginPath(); ctx.arc(ex1,ey1,eSize,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2,ey2,eSize,0,Math.PI*2); ctx.fill();
      } else {
        const shade = 1 - t*0.35 + flash*0.4;
        const r = Math.floor(16 + 40*shade);
        const g = Math.floor(185 - 30*(1-shade));
        const b = Math.floor(129 - 40*(1-shade));
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        roundRect(x+p,y+p,cell-p*2,cell-p*2,cell*0.22);
        ctx.fill();
      }
    });
    if (ateFlash > 0) ateFlash--;
  }

  function loop(now) {
    if (!running) return;
    if (!paused) {
      if (now - lastTick >= tickMs) { tick(); lastTick = now; }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    running = true; paused = false;
    pauseBtn.textContent = '⏸ Pausar';
    lastTick = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    overlayTitle.textContent = 'Fim de jogo';
    overlayText.textContent = score > 0 && score === best ? 'Novo recorde! 🎉' : 'Que pena! Tente de novo.';
    finalScore.style.display = 'block';
    finalScore.textContent = score + ' pts';
    startBtn.textContent = 'Jogar de novo';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Continuar' : '⏸ Pausar';
    if (paused) {
      overlayTitle.textContent = 'Pausado';
      overlayText.textContent = 'Aperte espaço ou toque em continuar.';
      finalScore.style.display = 'none';
      startBtn.textContent = 'Continuar';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTick = performance.now();
    }
  }

  function setDir(x,y) {
    if (!running || paused) return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = {x,y};
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k==='arrowup'||k==='w')         { setDir(0,-1); e.preventDefault(); }
    else if (k==='arrowdown'||k==='s')  { setDir(0,1);  e.preventDefault(); }
    else if (k==='arrowleft'||k==='a')  { setDir(-1,0); e.preventDefault(); }
    else if (k==='arrowright'||k==='d') { setDir(1,0);  e.preventDefault(); }
    else if (k===' ') { if (running) togglePause(); else start(); e.preventDefault(); }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  });

  document.getElementById('touchpad').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset.dir;
    if (d==='up') setDir(0,-1);
    else if (d==='down') setDir(0,1);
    else if (d==='left') setDir(-1,0);
    else if (d==='right') setDir(1,0);
  });

  document.querySelectorAll('.diff-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      difficulty = b.dataset.level;
      best = loadBest();
      updateHud();
      if (!running) overlayText.textContent = 'Dificuldade: ' + DIFFICULTIES[difficulty].label + '. Use as setas ou WASD.';
    });
  });

  startBtn.addEventListener('click', () => { if (paused) togglePause(); else start(); });
  pauseBtn.addEventListener('click', togglePause);

  resize(); reset(); draw();
  best = loadBest();
  updateHud();
})();
</script>
</body>
</html>
